<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ValhallaMMO — Server Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13110e;
  --bg2:#1b1813;
  --panel:#201c16;
  --panel2:#272219;
  --line:#3a3326;
  --line2:#4a4232;
  --gold:#c9a227;
  --gold-dim:#9a7c1e;
  --ink:#e8e0cf;
  --ink-dim:#a99f88;
  --ink-faint:#7a7160;
  --green:#7fae4b;
  --blue:#5b9bd5;
  --red:#cc5a4a;
  --purple:#9d7cc4;
  --teal:#4fb09a;
  --orange:#d98b3a;
  --radius:10px;
  --serif:'Spectral',Georgia,serif;
  --display:'Cinzel',serif;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--serif);
  font-size:16px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 50% 0%, #1f1b14 0%, var(--bg) 60%);
  min-height:100vh;
}
::selection{background:var(--gold);color:#1a1710}
a{color:var(--gold);text-decoration:none}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}

/* ===== Header ===== */
header{
  border-bottom:1px solid var(--line);
  background:rgba(19,17,14,0.85);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
}
.head-inner{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:14px}
.crest{
  width:40px;height:40px;border:1.5px solid var(--gold);border-radius:8px;
  display:grid;place-items:center;color:var(--gold);font-size:22px;
  background:linear-gradient(160deg,#241f17,#1a1610);
}
.brand h1{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:0.04em;color:var(--ink)}
.brand .sub{font-size:11px;color:var(--ink-faint);letter-spacing:0.18em;text-transform:uppercase;font-family:var(--mono)}
.nav{display:flex;gap:4px}
.nav button{
  background:none;border:none;color:var(--ink-dim);font-family:var(--serif);
  font-size:14px;padding:8px 14px;border-radius:7px;cursor:pointer;transition:.18s;letter-spacing:0.01em;
}
.nav button:hover{color:var(--ink);background:var(--panel)}
.nav button.active{color:var(--gold);background:var(--panel);box-shadow:inset 0 -2px 0 var(--gold)}
.menu-btn{display:none;background:none;border:1px solid var(--line2);color:var(--ink);width:40px;height:40px;border-radius:8px;font-size:20px;cursor:pointer}

/* ===== Page sections ===== */
.page{display:none;padding:48px 0 80px;animation:fade .4s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.kicker{font-family:var(--mono);font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:10px}
.page h2{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:0.02em;margin-bottom:8px;color:var(--ink)}
.page .lede{font-size:18px;color:var(--ink-dim);max-width:680px;margin-bottom:36px;font-weight:400}
h3{font-family:var(--display);font-size:21px;font-weight:600;margin:40px 0 16px;color:var(--ink);letter-spacing:0.02em}
h4{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:0.05em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
p{margin-bottom:14px;color:var(--ink-dim)}
p strong,li strong{color:var(--ink);font-weight:600}

/* ===== Cards ===== */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{
  background:linear-gradient(160deg,var(--panel),var(--bg2));
  border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:.2s;
}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card .ico{font-size:26px;margin-bottom:12px;display:block}
.card h4{margin-bottom:8px}
.card .title{font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink);margin-bottom:8px}
.card p{font-size:14.5px;margin-bottom:0;color:var(--ink-dim)}

/* hero */
.hero{
  border:1px solid var(--line);border-radius:14px;padding:40px;margin-bottom:40px;
  background:linear-gradient(135deg,#241f16 0%,#1a1610 60%);position:relative;overflow:hidden;
}
.hero::after{content:"⚔";position:absolute;right:-10px;bottom:-30px;font-size:180px;opacity:0.05;color:var(--gold)}
.hero h2{font-size:40px;margin-bottom:14px}
.hero p{font-size:17px;max-width:640px}
.stats-row{display:flex;gap:30px;margin-top:28px;flex-wrap:wrap;position:relative;z-index:1}
.stat-b{border-left:2px solid var(--gold);padding-left:14px}
.stat-b .n{font-family:var(--display);font-size:28px;font-weight:700;color:var(--gold);line-height:1}
.stat-b .l{font-size:12px;color:var(--ink-faint);letter-spacing:0.1em;text-transform:uppercase;font-family:var(--mono);margin-top:4px}

/* skill chips */
.skill-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 11px;border-radius:20px;font-family:var(--mono);letter-spacing:0.03em;border:1px solid var(--line2);color:var(--ink-dim);background:var(--panel)}

/* ===== Skill cards ===== */
.skill-card{
  background:linear-gradient(160deg,var(--panel),var(--bg2));
  border:1px solid var(--line);border-radius:var(--radius);padding:0;overflow:hidden;cursor:pointer;transition:.2s;
}
.skill-card:hover{border-color:var(--gold-dim);transform:translateY(-3px)}
.skill-card .sc-head{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
.sc-icon{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;font-size:24px;flex-shrink:0;border:1px solid var(--line2)}
.sc-name{font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink)}
.sc-cat{font-size:11px;font-family:var(--mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint)}
.skill-card .sc-body{padding:16px 20px}
.skill-card .sc-body p{font-size:14px;margin:0;color:var(--ink-dim);line-height:1.6}
.sc-more{padding:0 20px 16px;font-size:12.5px;font-family:var(--mono);color:var(--gold-dim);letter-spacing:0.05em}

/* ===== Tables ===== */
.tbl-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:18px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:12px 16px;background:var(--panel2);font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;border-bottom:1px solid var(--line)}
td{padding:11px 16px;border-bottom:1px solid var(--line);color:var(--ink-dim)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--panel)}
td.xp{font-family:var(--mono);color:var(--gold);font-size:13px}
td.lvl{font-family:var(--display);color:var(--ink);font-weight:600}

/* ===== Step flow ===== */
.flow{display:flex;flex-direction:column;gap:0;margin:24px 0;counter-reset:step}
.step{display:flex;gap:18px;position:relative;padding-bottom:28px}
.step:not(:last-child)::before{content:"";position:absolute;left:19px;top:42px;bottom:-2px;width:2px;background:var(--line2)}
.step-num{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:16px;color:var(--bg);background:var(--gold);position:relative;z-index:1;
}
.step-body{flex:1;padding-top:4px}
.step-body .st{font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink);margin-bottom:4px}
.step-body p{font-size:14.5px;margin:0}
.step-body .tag{display:inline-block;font-size:11px;font-family:var(--mono);padding:2px 9px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);color:var(--gold-dim);margin-top:8px;letter-spacing:0.05em}

/* ===== Calculator ===== */
.calc{background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:28px;margin:24px 0}
.calc label{display:block;font-family:var(--mono);font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px}
.calc input[type=range]{width:100%;accent-color:var(--gold);height:6px;margin-bottom:6px}
.calc-out{display:flex;align-items:baseline;gap:12px;margin-top:18px}
.calc-out .big{font-family:var(--display);font-size:38px;font-weight:700;color:var(--gold);line-height:1}
.calc-out .unit{font-size:14px;color:var(--ink-dim)}
.calc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.calc-mini{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px}
.calc-mini .n{font-family:var(--mono);font-size:18px;color:var(--ink);font-weight:500}
.calc-mini .l{font-size:11px;color:var(--ink-faint);font-family:var(--mono);letter-spacing:0.05em;margin-top:3px}

/* search */
.search-bar{position:relative;margin-bottom:22px}
.search-bar input{
  width:100%;padding:13px 16px 13px 44px;font-family:var(--serif);font-size:15px;
  background:var(--panel);border:1px solid var(--line2);border-radius:9px;color:var(--ink);
}
.search-bar input:focus{outline:none;border-color:var(--gold-dim)}
.search-bar .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:17px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:0.04em;padding:6px 13px;border-radius:20px;border:1px solid var(--line2);background:var(--panel);color:var(--ink-dim);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--gold-dim);color:var(--ink)}
.chip.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:500}

.badge{display:inline-block;font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:5px;letter-spacing:0.04em;font-weight:500}
.b-grid{background:rgba(91,155,213,.15);color:var(--blue);border:1px solid rgba(91,155,213,.3)}
.b-cauldron{background:rgba(79,176,154,.15);color:var(--teal);border:1px solid rgba(79,176,154,.3)}
.b-immersive{background:rgba(217,139,58,.15);color:var(--orange);border:1px solid rgba(217,139,58,.3)}
.b-smith{background:rgba(157,124,196,.15);color:var(--purple);border:1px solid rgba(157,124,196,.3)}

.callout{border-left:3px solid var(--gold);background:var(--panel);padding:16px 20px;border-radius:0 8px 8px 0;margin:20px 0}
.callout p{margin:0;font-size:14.5px}
.callout.warn{border-color:var(--red)}
.callout .ct{font-family:var(--display);font-weight:600;color:var(--ink);font-size:14px;margin-bottom:4px;letter-spacing:0.03em}

footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--ink-faint);font-size:13px;font-family:var(--mono)}

@media(max-width:860px){
  .nav{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--line);padding:8px}
  .nav.open{display:flex}
  .menu-btn{display:grid;place-items:center}
  .g4,.g3{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .calc-grid{grid-template-columns:1fr}
  .page h2{font-size:27px}.hero h2{font-size:28px}
}
@media(max-width:520px){.g4,.g3{grid-template-columns:1fr}}
</style>
</head>

</header>

<main class="wrap" id="main"></main>

    <h3>Where to start</h3>
    <div class="grid g2">
      <div class="card" style="cursor:pointer" onclick="go('skills')"><h4>New player?</h4><div class="title">Read the Skills page →</div><p>Understand what each of the 14 skills does and how to train it. This is the heart of the plugin.</p></div>
      <div class="card" style="cursor:pointer" onclick="go('smithing')"><h4>Want better gear?</h4><div class="title">Learn the Smithing flow →</div><p>The craft → heat → quench → fit → sharpen pipeline is the most-misunderstood system. We break it down step by step.</p></div>
    </div>
  </section>`;
}

function skills(){
  const cats = ['Gathering','Combat','Defense','Crafting','Meta'];
  let html = `<section class="page active">
    <div class="kicker">The 14 Skills</div>
    <h2>Skills &amp; how to train them</h2>
    <p class="lede">Every skill levels by doing its activity — no menus, no grind targets. Click any skill to see its best XP sources.</p>`;
  cats.forEach(cat => {
    const list = DATA.skills.filter(s => s.cat === cat);
    if(!list.length) return;
    html += `<h3>${cat}</h3><div class="grid g3" style="margin-bottom:8px">`;
    list.forEach(s => {
      html += `<div class="skill-card" onclick="skillDetail('${s.id}')">
        <div class="sc-head">
          <div class="sc-icon" style="color:${s.color};background:${s.color}1a">${s.icon}</div>
          <div><div class="sc-name">${s.name}</div><div class="sc-cat">${s.cat}</div></div>
        </div>
        <div class="sc-body"><p>${s.desc}</p></div>
        <div class="sc-more">View XP sources →</div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</section>`;
  main.innerHTML = html;
}

function skillDetail(id){
  const s = DATA.skills.find(x => x.id === id);
  let rows = '';
  s.top.forEach(t => {
    if(t.length === 1){ rows += `<tr><td colspan="2" style="font-style:italic">${t[0]}</td></tr>`; }
    else { rows += `<tr><td>${t[0]}</td><td class="xp">${typeof t[1]==='number'?fmt(t[1])+' XP':t[1]}</td></tr>`; }
  });
  main.innerHTML = `<section class="page active">
    <button class="chip" onclick="go('skills')" style="margin-bottom:24px">← All skills</button>
    <div class="hero" style="margin-bottom:30px">
      <div style="display:flex;align-items:center;gap:18px">
        <div class="sc-icon" style="width:64px;height:64px;font-size:34px;color:${s.color};background:${s.color}1a;border-color:${s.color}55">${s.icon}</div>
        <div><div class="kicker" style="margin-bottom:4px">${s.cat} skill</div><h2 style="margin:0;font-size:32px">${s.name}</h2></div>
      </div>
      <p style="margin-top:20px">${s.desc}</p>
    </div>
    <div class="grid g2">
      <div class="card"><h4>How you train it</h4><p>${s.how}</p></div>
      <div class="card"><h4>Special ability</h4><p>${s.ability}</p></div>
    </div>
    <h3>Top XP sources</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Action / drop</th><th>XP earned</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="callout"><div class="ct">Tip</div><p>Only naturally-generated blocks and legitimate kills grant XP. Placing then re-breaking a block gives nothing, and farming XP in one chunk too fast triggers a diminishing-returns nerf.</p></div>
  </section>`;
  window.scrollTo({top:0,behavior:'smooth'});
}
window.skillDetail = skillDetail;
window.go = go;

function leveling(){
  let rows = '';
  DATA.curve.milestones.forEach(m => {
    rows += `<tr><td class="lvl">${m[0]}</td><td class="xp">${fmt(m[1])}</td><td class="xp" style="color:var(--ink-dim)">${fmt(m[2])}</td></tr>`;
  });
  main.innerHTML = `<section class="page active">
    <div class="kicker">Experience &amp; Progression</div>
    <h2>How leveling works</h2>
    <p class="lede">Skills get exponentially harder to level. Early levels fly by; the last stretch to 100 is a real commitment.</p>

    <div class="grid g3">
      <div class="card"><span class="ico">📈</span><div class="title">Per-skill XP</div><p>Each of the 14 skills tracks its own XP and level, capped at <strong>100</strong>. You raise it by performing that skill's activity.</p></div>
      <div class="card"><span class="ico">✦</span><div class="title">Power level</div><p>All skill XP also pours into <strong>Power</strong> (max 256). Power grants the skill points you spend on perks.</p></div>
      <div class="card"><span class="ico">🌳</span><div class="title">Perks &amp; trees</div><p>Open a skill tree with <code>/skills</code>, then spend points to unlock perks. Many perks have level requirements.</p></div>
    </div>

    <h3>The XP curve (per skill)</h3>
    <p>XP needed for the next level follows this formula, where <code>level</code> is the level you're climbing toward:</p>
    <div class="callout"><p style="font-family:var(--mono);color:var(--gold);font-size:15px">${DATA.curve.formula}</p></div>

    <div class="calc">
      <label>Target level: <span id="lvlOut" style="color:var(--gold);font-family:var(--mono)">50</span></label>
      <input type="range" id="lvlSlider" min="1" max="100" value="50">
      <div class="calc-out"><span class="big" id="cumOut">97,670</span><span class="unit">total XP to reach this level</span></div>
      <div class="calc-grid">
        <div class="calc-mini"><div class="n" id="thisLvl">7,520</div><div class="l">XP for this level alone</div></div>
        <div class="calc-mini"><div class="n" id="oreEq">~244</div><div class="l">≈ diamond ore (400 XP ea.)</div></div>
        <div class="calc-mini"><div class="n" id="pctMax">9.8%</div><div class="l">of the way to level 100</div></div>
      </div>
    </div>

    <h3>Milestone reference</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Level</th><th>Total XP</th><th>This level costs</th></tr></thead><tbody>${rows}</tbody></table></div>

    <div class="grid g2" style="margin-top:30px">
      <div class="card"><h4>Diminishing returns</h4><p>Earning lots of XP in a single chunk too quickly triggers a nerf — XP drops to ~10% in that chunk. Move around as you grind to avoid it.</p></div>
      <div class="card"><h4>Overleveled gear penalty</h4><p>Using gear far above your skill level cripples it: up to −70% damage, −70% armor, and 10× durability loss. Match your gear tier to your level.</p></div>
    </div>
  </section>`;

  const slider = document.getElementById('lvlSlider');
  const F = lvl => (lvl + 75 * Math.pow(2, lvl/7.6)) + 300;
  function update(){
    const lvl = +slider.value;
    let cum = 0; for(let i=1;i<=lvl;i++) cum += F(i);
    const thisL = F(lvl);
    document.getElementById('lvlOut').textContent = lvl;
    document.getElementById('cumOut').textContent = fmt(Math.round(cum));
    document.getElementById('thisLvl').textContent = fmt(Math.round(thisL));
    document.getElementById('oreEq').textContent = '~' + fmt(Math.round(cum/400));
    document.getElementById('pctMax').textContent = (cum/7897845*100).toFixed(1) + '%';
  }
  slider.oninput = update; update();
}

function smithing(){
  let steps = '';
  DATA.smithSteps.forEach((s,i) => {
    steps += `<div class="step"><div class="step-num">${i+1}</div><div class="step-body"><div class="st">${s.t}</div><p>${s.d}</p><span class="tag">${s.tag}</span></div></div>`;
  });
  main.innerHTML = `<section class="page active">
    <div class="kicker">The Crafting Pipeline</div>
    <h2>Smithing &amp; gear quality</h2>
    <p class="lede">The Classic pack replaces vanilla crafting with a multi-step forge. Here's the full lifecycle of a weapon, from raw ingot to fully tinkered netherite.</p>

    <div class="callout"><div class="ct">The golden rule</div><p>Your <strong>Smithing level</strong> at the moment you craft sets the item's quality — and quality scales every stat. Level Smithing before forging your endgame gear.</p></div>

    <div class="flow">${steps}</div>

    <h3>The quality system</h3>
    <div class="grid g2">
      <div class="card"><h4>Quality scaling</h4><p>Each item gets a quality value at craft time, tied to your Smithing level. A higher-quality sword has more damage and durability than a low-quality one — same recipe, different smith.</p></div>
      <div class="card"><h4>Copper tier</h4><p>A custom material between stone and iron, with its own ingots, nuggets, armor (with custom color) and full weapon set. A great mid-game step.</p></div>
    </div>

    <h3>Custom items in the pack</h3>
    <div class="grid g2">
      <div class="card"><div class="title">Hot iron / gold / netherite</div><p>Created by smelting a raw ingot in a furnace. These are <strong>not</strong> used in quenching — do not drop these in a cauldron. They exist as custom items in the pack but are not consumed by any Classic recipe.</p></div>
      <div class="card"><div class="title">Unstable diamond</div><p>Made via the <code>destabilize_diamond</code> grid recipe. Required to upgrade diamond gear to netherite at the smithing table.</p></div>
    </div>
    <div class="callout warn"><div class="ct">Common mistake</div><p>To quench, you heat <strong>the weapon or armor itself</strong> in a furnace, then drop <strong>that heated item</strong> into a water cauldron. Do not smelt ingots and drop the hot ingots — that does nothing (you'll just hear a fizzle).</p></div>
  </section>`;
}

function tinker(){
  let html = `<section class="page active">
    <div class="kicker">Item Modification</div>
    <h2>Tinker upgrades</h2>
    <p class="lede">49 upgrades you apply at the crafting table to customize gear. The item must have been Valhalla-crafted, and most upgrades stack up to 4 times.</p>
    <div class="callout"><div class="ct">How to apply</div><p>Place your gear in the crafting grid with the upgrade's ingredients. Each upgrade consumes one of the item's upgrade slots — raise the cap with the <strong>Bonus slot 1/2/3</strong> upgrades.</p></div>`;
  Object.entries(DATA.tinker).forEach(([cat,list]) => {
    html += `<h3>${cat}</h3><div class="grid g3">`;
    list.forEach(u => {
      html += `<div class="card" style="padding:16px 18px"><div class="title" style="font-size:15px;margin-bottom:6px">${u[0]}</div><p style="font-size:13.5px">${u[1]}</p></div>`;
    });
    html += `</div>`;
  });
  html += `</section>`;
  main.innerHTML = html;
}

function recipes(){
  main.innerHTML = `<section class="page active">
    <div class="kicker">Recipe Browser</div>
    <h2>All recipes</h2>
    <p class="lede">Every craft, quench, sharpen and upgrade recipe in the Classic pack — 356 player-facing recipes. (A further 199 internal &ldquo;heat&rdquo; steps power the furnace stage and aren&rsquo;t shown here.)</p>
    <div class="search-bar"><span class="si">⌕</span><input id="rsearch" placeholder="Search recipes — try 'diamond', 'quench', 'copper'…"></div>
    <div class="filters" id="rfilters">
      <span class="chip active" data-f="all">All</span>
      <span class="chip" data-f="grid">Grid table</span>
      <span class="chip" data-f="cauldron">Cauldron</span>
      <span class="chip" data-f="immersive">Grindstone</span>
      <span class="chip" data-f="smith">Smithing table</span>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th>Recipe</th><th>Station</th><th>Smithing XP</th></tr></thead><tbody id="rbody"></tbody></table></div>
  </section>`;

  const badge = {grid:['Grid table','b-grid'],cauldron:['Cauldron','b-cauldron'],immersive:['Grindstone','b-immersive'],smith:['Smithing table','b-smith']};
  let filter = 'all', query = '';
  function pretty(n){ return n.replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase()); }
  function draw(){
    const rows = RECIPES.filter(r => (filter==='all'||r[1]===filter) && r[0].includes(query));
    const body = document.getElementById('rbody');
    body.innerHTML = rows.slice(0,250).map(r => {
      const b = badge[r[1]];
      return `<tr><td>${pretty(r[0])}</td><td><span class="badge ${b[1]}">${b[0]}</span></td><td class="xp">${r[2]?fmt(r[2]):'—'}</td></tr>`;
    }).join('') || `<tr><td colspan="3" style="color:var(--ink-faint)">No recipes match.</td></tr>`;
    if(rows.length>250) body.innerHTML += `<tr><td colspan="3" style="color:var(--ink-faint);font-style:italic">…and ${rows.length-250} more — refine your search.</td></tr>`;
  }
  document.getElementById('rsearch').oninput = e => { query = e.target.value.toLowerCase(); draw(); };
  document.querySelectorAll('#rfilters .chip').forEach(c => c.onclick = () => {
    document.querySelectorAll('#rfilters .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active'); filter = c.dataset.f; draw();
  });
  draw();
}

home();
</script>
</body>
</html>
